```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SPAWN</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <nav class="bg-gray-900 text-white">

        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between">

            <h2 class="text-2xl font-bold">
                SPAWN
            </h2>

            <div class="flex flex-wrap gap-4 mt-3 sm:mt-0">
                <a href="../../index.html" class="hover:text-purple-400">Home</a>
                <a href="about.html" class="hover:text-purple-400">About</a>
                <a href="contact.html" class="hover:text-purple-400">Contact</a>
                <a href="signup.html" class="hover:text-purple-400">Sign Up</a>
                <a href="signin.html" class="hover:text-purple-400">Sign In</a>
            </div>

        </div>

    </nav>

    <section class="py-12">

        <div class="max-w-md mx-auto px-6">

            <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">

                <h2 class="text-2xl font-bold text-gray-900 text-center">
                    Create Your Account
                </h2>

                <p class="text-gray-600 text-center mt-2">
                    Join the SPAWN gaming community.
                </p>

            </div>

            <form class="mt-6">

                <div class="bg-white border border-gray-200 rounded-lg shadow-sm p-6">

                    <label for="name" class="block mb-2 text-sm font-medium text-gray-900">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full px-3 py-2.5 shadow-sm"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="mt-6 bg-white border border-gray-200 rounded-lg shadow-sm p-6">

                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full px-3 py-2.5 shadow-sm"
                        placeholder="name@example.com"
                        required
                    >

                </div>

                <div class="mt-6 bg-white border border-gray-200 rounded-lg shadow-sm p-6">

                    <label for="password" class="block mb-2 text-sm font-medium text-gray-900">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full px-3 py-2.5 shadow-sm"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <div class="mt-6 bg-white border border-gray-200 rounded-lg shadow-sm p-6">

                    <label for="confirm-password" class="block mb-2 text-sm font-medium text-gray-900">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-purple-500 focus:border-purple-500 block w-full px-3 py-2.5 shadow-sm"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

                <div class="mt-6">

                    <label class="flex items-center">

                        <input
                            type="checkbox"
                            class="w-4 h-4 text-purple-600 bg-gray-100 border-gray-300 rounded focus:ring-purple-500"
                            required
                        >

                        <span class="ml-2 text-sm text-gray-600">
                            I agree to the terms and conditions
                        </span>

                    </label>

                </div>

                <div class="mt-6">

                    <button
                        type="submit"
                        class="w-full text-white bg-purple-600 hover:bg-purple-700 focus:ring-4 focus:outline-none focus:ring-purple-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center shadow-sm"
                    >
                        Create Account
                    </button>

                </div>

                <p class="text-sm text-gray-600 text-center mt-6">
                    Already have an account?
                    <a href="signin.html" class="text-purple-600 hover:underline font-medium">
                        Sign in
                    </a>
                </p>

            </form>

        </div>

    </section>

    <footer class="bg-gray-900 text-white py-8 mt-12">

        <div class="max-w-6xl mx-auto px-6 text-center">

            <h2 class="text-xl font-bold">
                SPAWN
            </h2>

            <p class="text-gray-400 mt-2">
                A community for gamers to connect, discover and play.
            </p>

            <div class="flex flex-wrap justify-center gap-6 mt-4">
                <a href="../../index.html" class="hover:text-purple-400">Home</a>
                <a href="about.html" class="hover:text-purple-400">About</a>
                <a href="contact.html" class="hover:text-purple-400">Contact</a>
            </div>

            <p class="text-gray-500 text-sm mt-6">
                © 2026 SPAWN. All rights reserved.
            </p>

        </div>

    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.5.2/flowbite.min.js"></script>

</body>

</html>
